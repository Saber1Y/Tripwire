[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Reactive Omni targets solc 0.8.29; cancun keeps bytecode portable across Lasna and the origin chains.
solc = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"

[fmt]
line_length = 120
